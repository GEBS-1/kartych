[project]
name = "cupcard"
version = "0.1.0"
description = "Картыч — карта лояльности в MAX: бот, сайт и мини-приложение."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "segno>=1.6.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "faker>=33.0.0",
  "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
