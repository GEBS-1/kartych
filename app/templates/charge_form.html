{% extends "site_base.html" %}{% block content %}<p class="eyebrow">{{ shop.name }}</p><header class="page-heading"><h1>Покупка гостя</h1>{{ icon('qr') }}</header><nav class="segments"><a href="/biz/earn">Показать QR</a><a class="active" href="/biz/scan">Считать гостя</a></nav><section class="panel"><h2>{{ guest.display_name }}</h2><p class="muted">Покупка запишется сразу — гостю не нужно ничего сканировать.</p><form method="post" action="/biz/charge/{{ guest.max_user_id }}"><label>Акция<select name="program_id">{% for program in programs %}<option value="{{ program.id }}">{{ program.title }}</option>{% else %}<option value="">Без акции — записать покупку</option>{% endfor %}</select></label><label>Что купили<input name="items" required maxlength="200" value="Покупка"></label><div class="form-grid"><label>Количество<input type="number" name="qty" min="1" max="10000" value="1" required></label><label>Сумма, ₽<input type="number" name="amount_rub" min="0" max="1000000" value="0" required></label></div><label>Место / касса<input name="place" maxlength="200" placeholder="{{ shop.address or shop.name }}"></label><button class="btn full">Записать покупку</button></form></section>{% endblock %}
